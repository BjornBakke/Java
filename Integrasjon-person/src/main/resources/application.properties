# ===================================================================
# OpenAPI / Swagger UI Configuration
# ===================================================================

# Swagger UI Path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# API Documentation Path
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true

# Swagger UI Features
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.displayOperationId=false
springdoc.swagger-ui.showExtensions=true
springdoc.swagger-ui.showCommonExtensions=true

# Package to scan
springdoc.packages-to-scan=no.bakkesracingteam.Integrasjonperson

# Paths to match
springdoc.paths-to-match=/api/**

# Enable pretty print for JSON
springdoc.writer-with-default-pretty-printer=true

# Show actuator endpoints in OpenAPI
springdoc.show-actuator=true

# ===================================================================
# Virtual Threads (Project Loom)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# Application Information
# ===================================================================
spring.application.name=Integrasjon-person
spring.profiles.active=default
info.app.name=Integrasjon Person API
info.app.description=Advanced Person Integration Service with comprehensive OpenAPI documentation
info.app.version=1.0.0
logging.level.web=DEBUG
